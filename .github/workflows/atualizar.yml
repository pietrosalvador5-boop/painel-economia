# Atualiza o painel todo dia às 9h10 (horário de Brasília): baixa os dados de novo (BCB e IBGE),
# gera o index.html e publica no GitHub Pages. Também pode ser rodado à mão na aba Actions
# ("Atualiza o painel" → "Run workflow").
name: Atualiza o painel

on:
  schedule:
    - cron: "10 12 * * *"   # 12h10 UTC = 9h10 em Brasília (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency: atualizar-painel

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - name: Baixa os dados
        run: python3 python/coleta.py

      - name: Gera a página
        run: |
          python3 python/gerar_offline.py
          cp offline/Painel_Economia_Brasil_RS.html index.html

      - name: Publica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza o painel ($(date +%d/%m/%Y))"
            git push
          fi
