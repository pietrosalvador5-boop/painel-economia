# Atualiza o painel todo dia às 9h10 (horário de Brasília): baixa os dados de novo (BCB e IBGE),
# gera o index.html e publica no GitHub Pages. Também pode ser rodado à mão na aba Actions
# ("Atualiza o painel" → "Run workflow").
name: Atualiza o painel

on:
  schedule:            # vários horários porque o GitHub costuma atrasar (às vezes horas) os agendamentos;
    - cron: "10 12 * * *"   # 9h10 em Brasília
    - cron: "40 12 * * *"   # 9h40
    - cron: "10 14 * * *"   # 11h10
    - cron: "10 17 * * *"   # 14h10 (quando não há dado novo, a execução não muda nada)
  workflow_dispatch:

permissions:
  contents: write

concurrency: atualizar-painel

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v5

      - name: Baixa os dados
        run: python3 python/coleta.py

      - name: Gera a página
        run: |
          python3 python/gerar_offline.py
          cp offline/Painel_Economia_Brasil_RS.html index.html

      - name: Publica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dados/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza o painel ($(date +%d/%m/%Y))"
            git pull --rebase -X theirs origin main   # traz edições feitas no GitHub; em conflito, vale o dado novo do robô
            git push
          fi

      - name: Avisa se alguma fonte falhou (o resto já foi publicado)
        run: |
          if [ -s falhas.txt ]; then
            echo "Fontes que não responderam (ficou o dado anterior):"; cat falhas.txt 2>/dev/null
            exit 1
          fi
